<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title></title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #111;
      transition: background-color 0.25s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      width: 100vw;
      height: 100dvh;
    }
  </style>
</head>

<body>
  <main class="screen"></main>

<script>

const COLORS = [
  "#ff3030",
  "#2878ff",
  "#25c96f",
  "#ffd52e",
  "#9b5cff",
  "#ff8a24",
  "#ff4fa3",
  "#16d9d2"
];

const idKey = "magicColorViewerId";

const id =
  localStorage.getItem(idKey) ||
  crypto.randomUUID();

localStorage.setItem(idKey, id);

let lastVersion = null;
let currentColor = null;

function randomColor() {
  return COLORS[Math.floor(Math.random() * COLORS.length)];
}

function setColor(color) {
  currentColor = color;
  document.body.style.backgroundColor = color;
}

function localRandomColor() {
  let color;

  do {
    color = randomColor();
  } while (color === currentColor && COLORS.length > 1);

  setColor(color);
}

// Сразу выдаём случайный цвет
localRandomColor();

async function poll() {

  try {

    const response = await fetch(
      "/api/state?id=" + encodeURIComponent(id),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) return;

    const data = await response.json();

    /*
      Если фокусник изменил состояние —
      применяем его команду.
    */

    if (
      data.version !== lastVersion ||
      data.color !== currentColor
    ) {

      lastVersion = data.version;

      setColor(data.color);
    }

  } catch (error) {
    // Если интернет временно пропал,
    // оставляем текущий цвет.
  }
}

/*
  Нажатие на экран зрителем.
  Меняем цвет локально.
*/

document.body.addEventListener("click", () => {

  localRandomColor();

});

/*
  Следим за командами фокусника.
*/

poll();

setInterval(poll, 500);

</script>

</body>
</html>
