<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Colors — Control</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.wrap{max-width:720px;margin:0 auto}h1{margin:0 0 8px;font-size:28px}.muted{opacity:.55;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{border:0;border-radius:18px;min-height:90px;cursor:pointer;font-size:18px;font-weight:800;box-shadow:0 8px 25px rgba(0,0,0,.25)}.color{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}.yellow,.cyan{color:#111;text-shadow:none}.row{display:flex;gap:12px;margin-top:12px}.row button{flex:1;min-height:64px}.black{background:#000;color:#fff;border:1px solid #333}.white{background:#fff;color:#111}.random{background:#333;color:#fff}#login{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(420px,100%);background:#1b1b1b;padding:24px;border-radius:22px}input{width:100%;padding:16px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:18px;margin:12px 0}.loginBtn{width:100%;background:#fff;color:#111;min-height:56px}#app{display:none}.online{margin:20px 0;font-size:20px}#msg{margin-top:16px;opacity:.7;min-height:22px}</style></head><body><div id="login"><div class="card"><h1>Управление</h1><div class="muted">Введите пароль администратора.</div><input id="password" type="password" placeholder="Пароль"><button class="loginBtn" onclick="login()">Войти</button><div id="loginMsg"></div></div></div><div id="app"><div class="wrap"><h1>MAGIC COLORS</h1><div class="muted">Панель управления зрительскими телефонами</div><div class="online">Зрителей: <b id="count">—</b></div><div class="grid"><button class="color" style="background:#ff3030" onclick="setColor('red')">КРАСНЫЙ</button><button class="color" style="background:#2878ff" onclick="setColor('blue')">СИНИЙ</button><button class="color" style="background:#25c96f" onclick="setColor('green')">ЗЕЛЁНЫЙ</button><button class="yellow" style="background:#ffd52e" onclick="setColor('yellow')">ЖЁЛТЫЙ</button><button class="color" style="background:#9b5cff" onclick="setColor('purple')">ФИОЛЕТОВЫЙ</button><button class="color" style="background:#ff8a24" onclick="setColor('orange')">ОРАНЖЕВЫЙ</button><button class="color" style="background:#ff4fa3" onclick="setColor('pink')">РОЗОВЫЙ</button><button class="cyan" style="background:#16d9d2" onclick="setColor('cyan')">БИРЮЗОВЫЙ</button></div><div class="row"><button class="random" onclick="randomize()">🎲 НОВЫЕ СЛУЧАЙНЫЕ</button><button class="black" onclick="setColor('black')">ЧЁРНЫЙ</button><button class="white" onclick="setColor('white')">БЕЛЫЙ</button></div><div id="msg"></div></div></div><script>let token=sessionStorage.getItem('magicAdminToken');function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';updateCount();setInterval(updateCount,2000)}async function login(){const password=document.getElementById('password').value;try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');token=d.token;sessionStorage.setItem('magicAdminToken',token);showApp()}catch(e){document.getElementById('loginMsg').textContent=e.message}}async function command(action,color){const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,color})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');document.getElementById('msg').textContent=d.message||'Готово'}async function setColor(c){try{await command('force',c)}catch(e){document.getElementById('msg').textContent=e.message}}async function randomize(){try{await command('random')}catch(e){document.getElementById('msg').textContent=e.message}}async function updateCount(){if(!token)return;try{const r=await fetch('/api/control?action=count',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.ok)document.getElementById('count').textContent=(await r.json()).count}catch(e){}}if(token)showApp();</script></body></html>
