<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Colors — Control</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.wrap{max-width:720px;margin:0 auto}h1{margin:0 0 8px;font-size:28px}.muted{opacity:.55;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{border:0;border-radius:18px;min-height:90px;cursor:pointer;font-size:18px;font-weight:800;box-shadow:0 8px 25px rgba(0,0,0,.25);transition:transform .08s}button:active{transform:scale(.97)}.color{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}.yellow,.cyan{color:#111;text-shadow:none}.row{display:flex;gap:12px;margin-top:12px}.row button{flex:1;min-height:64px}.black{background:#000;color:#fff;border:1px solid #333}.white{background:#fff;color:#111}.random{background:#333;color:#fff}.online{margin:20px 0;font-size:20px}#msg{margin-top:16px;opacity:.7;min-height:22px}
</style>
</head>
<body>
<div class="wrap">
<h1>MAGIC COLORS</h1>
<div class="muted">Панель управления зрительскими телефонами</div>
<div class="online">Зрителей: <b id="count">—</b></div>
<div class="grid">
<button class="color" style="background:#ff3030" onclick="setColor('red')">КРАСНЫЙ</button>
<button class="color" style="background:#2878ff" onclick="setColor('blue')">СИНИЙ</button>
<button class="color" style="background:#25c96f" onclick="setColor('green')">ЗЕЛЁНЫЙ</button>
<button class="yellow" style="background:#ffd52e" onclick="setColor('yellow')">ЖЁЛТЫЙ</button>
<button class="color" style="background:#9b5cff" onclick="setColor('purple')">ФИОЛЕТОВЫЙ</button>
<button class="color" style="background:#ff8a24" onclick="setColor('orange')">ОРАНЖЕВЫЙ</button>
<button class="color" style="background:#ff4fa3" onclick="setColor('pink')">РОЗОВЫЙ</button>
<button class="cyan" style="background:#16d9d2" onclick="setColor('cyan')">БИРЮЗОВЫЙ</button>
</div>
<div class="row">
<button class="random" onclick="randomize()">🎲 НОВЫЕ СЛУЧАЙНЫЕ</button>
<button class="black" onclick="setColor('black')">ЧЁРНЫЙ</button>
<button class="white" onclick="setColor('white')">БЕЛЫЙ</button>
</div>
<div id="msg"></div>
</div>
<script>
async function command(action,color){
  try{
    const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,color})});
    const d=await r.json();
    if(!r.ok)throw Error(d.error||'Ошибка');
    document.getElementById('msg').textContent=d.message||'Готово';
  }catch(e){document.getElementById('msg').textContent=e.message}
}
function setColor(color){command('force',color)}
function randomize(){command('random')}
async function updateCount(){
  try{
    const r=await fetch('/api/control?action=count',{cache:'no-store'});
    if(r.ok)document.getElementById('count').textContent=(await r.json()).count;
    else document.getElementById('count').textContent='—';
  }catch(e){document.getElementById('count').textContent='—'}
}
updateCount();setInterval(updateCount,2000);
</script>
</body>
</html>
